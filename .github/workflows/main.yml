name: readme to all

on: 
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'update?'
        required: true
        type: boolean
        default: false


jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write} 
    steps:
    - uses: actions/checkout@v4
      with: {fetch-depth: 0}
    - run: |
        CB=${GITHUB_REF#refs/heads/} 
        for r in $(git branch -r|grep -v HEAD|sed 's|origin/||'); do
          [ "$r" = "$CB" ] && continue
          git switch "$r"
          git restore --source "$CB" -- readme.md
          git add readme.md
          git commit -m "feat: 從 source-branch 複製特定檔案"
          git push


        done
