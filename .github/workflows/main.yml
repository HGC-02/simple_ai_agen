name: readme to all

on: 
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'update?'
        required: true
        type: boolean
        default: false


jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write} 
    steps:
    - uses: actions/checkout@v4
      with: {fetch-depth: 0}
    - run: |
        git config user.name nun_human_auto_helper && git config user.email eeeee@none.nullwhwer #i would like to name it that way ;>
        CB=${GITHUB_REF#refs/heads/}
        git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep -qx README.md || exit 0
        # coifg end ;)
        for r in $(git branch -r|grep -v HEAD|sed 's|origin/||'); do
          [ "$r" = "$CB" ] && continue
          git switch "$r"
          git restore --source "$CB" -- README.md
          git add README.md
          git commit -m "feat: 從 source-branch 複製特定檔案"
          git push
        done
